<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Abby Vue</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f5f7f5;color:#19241f;font:16px/1.5 system-ui}main{max-width:720px;margin:32px auto;padding:0 24px}header{display:flex;gap:12px;align-items:center;border-bottom:1px solid #cad4ce;padding-bottom:20px}header img{width:40px;height:40px}h1{font-size:26px;margin:0}section{padding:22px 0;border-bottom:1px solid #cad4ce}h2{font-size:17px;margin:0 0 12px}label{display:block;margin:10px 0}fieldset{border:0;padding:0;display:flex;gap:24px;margin:14px 0}fieldset label{margin:0}input[type=text],input[type=number]{display:block;padding:8px;width:100%;max-width:380px;border:1px solid #9fac9f;border-radius:4px;font:inherit}output{display:block;font-size:21px;font-weight:600;color:#1e634a}button{padding:8px 16px;border:1px solid #8d9d93;border-radius:4px;background:#fff;font:inherit;cursor:pointer}.flag{color:#5a3077}footer{margin-top:18px;color:#4c6256;font-size:14px}@media(max-width:480px){main{margin:20px auto;padding:0 18px}h1{font-size:24px}}
</style>
<main id="app"></main>
<script type="module" src="./main.ts"></script>
</html>
